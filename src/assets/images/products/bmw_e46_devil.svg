<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" width="750" height="1000">
  <defs>
    <radialGradient id="devilGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0505" />
      <stop offset="60%" stop-color="#0c0303" />
      <stop offset="100%" stop-color="#040202" />
    </radialGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="redFlame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Black Gallery Frame -->
  <rect x="0" y="0" width="750" height="1000" fill="url(#frameGradient)" />
  <rect x="15" y="15" width="720" height="970" fill="none" stroke="#25252a" stroke-width="2" />
  
  <!-- Passe-partout / Inner Canvas -->
  <rect x="35" y="35" width="680" height="930" fill="url(#devilGlow)" />

  <!-- Aggressive Background Typography: DEVIL -->
  <text x="375" y="260" font-family="'Cinzel', 'Oswald', sans-serif" font-weight="900" font-size="130" fill="#ff1a1a" opacity="0.18" letter-spacing="24" text-anchor="middle" filter="url(#crimsonGlow)">DEVIL</text>

  <!-- Top Editorial Header -->
  <text x="375" y="130" font-family="'Cinzel', serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="14" text-anchor="middle">BMW E46 M3</text>
  <text x="375" y="165" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2a2a" letter-spacing="6" text-anchor="middle">THE INLINE-6 BEAST // CODE DEVIL</text>

  <!-- Front View of BMW E46 with Glowing Red Angel Eyes -->
  <g transform="translate(135, 300)">
    <!-- Shadow -->
    <ellipse cx="240" cy="310" rx="220" ry="20" fill="#000000" opacity="0.9" />

    <!-- Hood & Windshield Silhouette -->
    <path d="M90 60 L390 60 L410 120 L440 180 L445 220 L435 270 L45 270 L35 220 L40 180 L70 120 Z" fill="#0a0303" stroke="#ff2a2a" stroke-width="1.5" opacity="0.8" />
    <path d="M120 70 L360 70 L380 120 L100 120 Z" fill="#030101" />

    <!-- Power Bulge Hood Lines -->
    <path d="M180 120 L210 210 M300 120 L270 210" stroke="#3d0a0a" stroke-width="2" />
    <path d="M210 210 C230 200 250 200 270 210" stroke="#ff2a2a" stroke-width="2" fill="none" opacity="0.5" />

    <!-- Iconic Kidney Grilles -->
    <g transform="translate(185, 205)">
      <!-- Left Kidney -->
      <rect x="0" y="0" width="45" height="38" rx="8" fill="#050101" stroke="#ff2a2a" stroke-width="2" />
      <line x1="12" y1="4" x2="12" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
      <line x1="22" y1="4" x2="22" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
      <line x1="32" y1="4" x2="32" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
      <!-- Right Kidney -->
      <rect x="65" y="0" width="45" height="38" rx="8" fill="#050101" stroke="#ff2a2a" stroke-width="2" />
      <line x1="77" y1="4" x2="77" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
      <line x1="87" y1="4" x2="87" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
      <line x1="97" y1="4" x2="97" y2="34" stroke="#ff2a2a" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Glowing Red Angel-Eye Headlights (The Devil Eyes) -->
    <!-- Left Headlight Assembly -->
    <g transform="translate(85, 195)" filter="url(#crimsonGlow)">
      <ellipse cx="20" cy="18" rx="16" ry="14" fill="none" stroke="#ff1a1a" stroke-width="3.5" />
      <ellipse cx="60" cy="18" rx="16" ry="14" fill="none" stroke="#ff1a1a" stroke-width="3.5" />
      <circle cx="20" cy="18" r="5" fill="#ffffff" />
      <circle cx="60" cy="18" r="5" fill="#ffffff" />
    </g>
    <!-- Right Headlight Assembly -->
    <g transform="translate(315, 195)" filter="url(#crimsonGlow)">
      <ellipse cx="20" cy="18" rx="16" ry="14" fill="none" stroke="#ff1a1a" stroke-width="3.5" />
      <ellipse cx="60" cy="18" rx="16" ry="14" fill="none" stroke="#ff1a1a" stroke-width="3.5" />
      <circle cx="20" cy="18" r="5" fill="#ffffff" />
      <circle cx="60" cy="18" r="5" fill="#ffffff" />
    </g>

    <!-- Lower Bumper Intake & Lip -->
    <path d="M120 255 L360 255 L380 290 L100 290 Z" fill="#000000" stroke="#ff2a2a" stroke-width="1.5" />
    <path d="M70 295 L410 295 L420 305 L60 305 Z" fill="#120202" stroke="#ff1a1a" stroke-width="2" />
  </g>

  <!-- Bold DEVIL Text Overlay -->
  <text x="375" y="660" font-family="'Cinzel', 'Oswald', sans-serif" font-weight="900" font-size="52" fill="#ff2a2a" letter-spacing="18" text-anchor="middle" filter="url(#crimsonGlow)">DEVIL</text>

  <!-- Editorial Specs Footer -->
  <g transform="translate(375, 760)" text-anchor="middle">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#3a0d0d" stroke-width="1" />
    <text y="40" font-family="'Cinzel', serif" font-size="20" fill="#ffffff" letter-spacing="6">BAVARIAN MOTOR WORKS</text>
    <text y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8f5c5c" letter-spacing="3">S54B32 NATURALLY ASPIRATED · 8,000 RPM REDLINE</text>
    <text y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff2a2a" letter-spacing="4">VELTOR ARCHIVE · SPEC 20×30 CM</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" width="750" height="1000">
  <defs>
    <radialGradient id="galleryBackdrop" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1f1c14" />
      <stop offset="60%" stop-color="#12100b" />
      <stop offset="100%" stop-color="#080705" />
    </radialGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="yellowPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5d020" />
      <stop offset="100%" stop-color="#f53803" />
    </linearGradient>
  </defs>

  <!-- Black Gallery Frame -->
  <rect x="0" y="0" width="750" height="1000" fill="url(#frameGradient)" />
  <rect x="15" y="15" width="720" height="970" fill="none" stroke="#2a2822" stroke-width="2" />
  
  <!-- Passe-partout / Inner Canvas -->
  <rect x="35" y="35" width="680" height="930" fill="url(#galleryBackdrop)" />

  <!-- Giant Crimson Red "911" in Background -->
  <text x="375" y="440" font-family="'Cinzel', 'Oswald', sans-serif" font-weight="900" font-size="280" fill="#dc2626" opacity="0.32" letter-spacing="-10" text-anchor="middle">911</text>

  <!-- Top Title & Badge -->
  <text x="375" y="130" font-family="'Cinzel', serif" font-weight="700" font-size="30" fill="#ffffff" letter-spacing="12" text-anchor="middle">PORSCHE 911 GT3 RS</text>
  <text x="375" y="165" font-family="'JetBrains Mono', monospace" font-size="13" fill="#eab308" letter-spacing="6" text-anchor="middle">RACING YELLOW // NATURALLY ASPIRATED 9,000 RPM</text>

  <!-- Speed Yellow 911 GT3 RS Silhouette Profile -->
  <g transform="translate(65, 360)">
    <!-- Floor Shadow -->
    <ellipse cx="310" cy="235" rx="280" ry="20" fill="#000000" opacity="0.9" />

    <!-- Huge GT3 RS Swan-Neck Wing -->
    <path d="M540 145 L565 65 L590 65 L570 145 Z" fill="#18181b" stroke="#eab308" stroke-width="1.5" />
    <path d="M515 65 L625 65 L615 78 L535 78 Z" fill="#dc2626" />
    <text x="575" y="75" font-family="'Cinzel', sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">PORSCHE</text>

    <!-- Aerodynamic Yellow Body -->
    <path d="M50 200 C65 175 110 162 170 158 C220 154 260 115 320 95 C380 75 440 85 480 110 C520 135 550 170 575 185 L585 190 L585 210 C575 220 550 225 520 225 L90 225 C65 225 50 215 50 200 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2" />

    <!-- Carbon Fiber Front Fender Louvers & Side Blade -->
    <g fill="#18181b">
      <rect x="155" y="160" width="30" height="4" rx="2" />
      <rect x="152" y="166" width="35" height="4" rx="2" />
      <rect x="150" y="172" width="38" height="4" rx="2" />
      <path d="M260 195 L390 195 L370 215 L280 215 Z" />
      <text x="325" y="210" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">GT3 RS</text>
    </g>

    <!-- Cockpit & Glass with Roll Cage Visible -->
    <path d="M260 145 C285 115 330 102 380 100 C430 98 460 115 480 145 Z" fill="#09090b" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Yellow Roll Cage Bar -->
    <line x1="390" y1="108" x2="460" y2="142" stroke="#eab308" stroke-width="3" />
    <line x1="400" y1="140" x2="450" y2="112" stroke="#eab308" stroke-width="3" />

    <!-- Wheels with Red Center-Lock Caps -->
    <g transform="translate(140, 215)">
      <circle cx="0" cy="0" r="44" fill="#09090b" stroke="#27272a" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#18181b" stroke="#eab308" stroke-width="1" />
      <circle cx="0" cy="0" r="8" fill="#dc2626" />
    </g>
    <g transform="translate(480, 215)">
      <circle cx="0" cy="0" r="44" fill="#09090b" stroke="#27272a" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#18181b" stroke="#eab308" stroke-width="1" />
      <circle cx="0" cy="0" r="8" fill="#dc2626" />
    </g>
  </g>

  <!-- Editorial Specs Footer -->
  <g transform="translate(375, 760)" text-anchor="middle">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#373121" stroke-width="1" />
    <text y="40" font-family="'Cinzel', serif" font-size="20" fill="#ffffff" letter-spacing="6">STUTTGART MOTORSPORT</text>
    <text y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a19b88" letter-spacing="3">4.0L FLAT-6 · 518 HP · ACTIVE DRS AERO</text>
    <text y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#eab308" letter-spacing="4">VELTOR ARCHIVE · SPEC 30×40 CM</text>
  </g>
</svg>

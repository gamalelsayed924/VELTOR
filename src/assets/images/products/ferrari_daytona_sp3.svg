<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" width="750" height="1000">
  <defs>
    <radialGradient id="maranelloBackdrop" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#220b0b" />
      <stop offset="60%" stop-color="#120606" />
      <stop offset="100%" stop-color="#070303" />
    </radialGradient>
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f24" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <linearGradient id="corsaRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Black Gallery Frame -->
  <rect x="0" y="0" width="750" height="1000" fill="url(#frameGradient)" />
  <rect x="15" y="15" width="720" height="970" fill="none" stroke="#2c2222" stroke-width="2" />
  
  <!-- Passe-partout / Inner Canvas -->
  <rect x="35" y="35" width="680" height="930" fill="url(#maranelloBackdrop)" />

  <!-- Bold Architectural FERRARI Lettering in Background -->
  <text x="375" y="320" font-family="'Cinzel', 'Oswald', sans-serif" font-weight="900" font-size="108" fill="#ef4444" opacity="0.22" letter-spacing="22" text-anchor="middle">FERRARI</text>
  <text x="375" y="380" font-family="'Cinzel', 'Oswald', sans-serif" font-weight="700" font-size="44" fill="#ffffff" opacity="0.16" letter-spacing="16" text-anchor="middle">DAYTONA SP3</text>

  <!-- Top Brand Header -->
  <text x="375" y="130" font-family="'Cinzel', serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="14" text-anchor="middle">FERRARI DAYTONA SP3</text>
  <text x="375" y="165" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ef4444" letter-spacing="6" text-anchor="middle">ICONA SERIES // ROSSO CORSA V12</text>

  <!-- Red Ferrari Daytona SP3 Targa Stance in Foreground -->
  <g transform="translate(60, 370)">
    <!-- Floor Shadow -->
    <ellipse cx="315" cy="235" rx="280" ry="20" fill="#000000" opacity="0.9" />

    <!-- Sculptural Rosso Corsa Daytona SP3 Body Lines -->
    <path d="M50 205 C65 180 110 165 170 160 C220 156 255 125 315 108 C375 92 435 98 475 118 C525 142 555 175 580 190 L590 195 L590 215 C580 224 555 228 525 228 L85 228 C65 228 50 218 50 205 Z" fill="url(#corsaRed)" stroke="#b91c1c" stroke-width="2" />

    <!-- Iconic Horizontal Rear Strakes / Blades of SP3 -->
    <g fill="#180404" stroke="#450a0a" stroke-width="1">
      <rect x="495" y="160" width="75" height="5" rx="1" />
      <rect x="490" y="170" width="85" height="5" rx="1" />
      <rect x="485" y="180" width="95" height="5" rx="1" />
      <rect x="480" y="190" width="105" height="5" rx="1" />
      <rect x="475" y="200" width="112" height="5" rx="1" />
    </g>

    <!-- Cockpit & Wrap-around Windshield -->
    <path d="M265 150 C290 125 330 112 375 110 C415 108 445 122 465 148 Z" fill="#090202" stroke="#ef4444" stroke-width="1.2" />

    <!-- Headlight Slats -->
    <line x1="75" y1="185" x2="115" y2="182" stroke="#ffffff" stroke-width="2" opacity="0.8" />
    <line x1="78" y1="192" x2="118" y2="189" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

    <!-- Sculpted Wheel Arches & Wheels -->
    <g transform="translate(145, 215)">
      <circle cx="0" cy="0" r="44" fill="#090202" stroke="#262626" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#171717" stroke="#ef4444" stroke-width="1" />
      <circle cx="0" cy="0" r="7" fill="#facc15" />
    </g>
    <g transform="translate(485, 215)">
      <circle cx="0" cy="0" r="44" fill="#090202" stroke="#262626" stroke-width="4" />
      <circle cx="0" cy="0" r="30" fill="#171717" stroke="#ef4444" stroke-width="1" />
      <circle cx="0" cy="0" r="7" fill="#facc15" />
    </g>
  </g>

  <!-- Editorial Specs Footer -->
  <g transform="translate(375, 760)" text-anchor="middle">
    <line x1="-220" y1="0" x2="220" y2="0" stroke="#381313" stroke-width="1" />
    <text y="40" font-family="'Cinzel', serif" font-size="20" fill="#ffffff" letter-spacing="6">SCUDERIA FERRARI</text>
    <text y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#9e7171" letter-spacing="3">6.5L NATURALLY ASPIRATED V12 · 829 HP · CARBON CHASSIS</text>
    <text y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ef4444" letter-spacing="4">VELTOR ARCHIVE · SPEC 30×40 CM</text>
  </g>
</svg>
